<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIFI Detector</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
.spinner{width:40px;height:40px;border:3px solid #2a2a4a;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:24px;letter-spacing:3px;margin-bottom:8px}
p{font-size:13px;color:#a0a0b0}
</style>
</head>
<body>
<div>
  <h1>HIFI Detector</h1>
  <div class="spinner"></div>
  <p>Starting engine...</p>
</div>
</body>
</html>
