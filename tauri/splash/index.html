<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIFI Detector</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e0e0e0;
    overflow: hidden;
  }
  .splash {
    text-align: center;
  }
  .icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.85; }
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 36px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .loader {
    width: 180px;
    height: 3px;
    background: #2a2a4a;
    border-radius: 2px;
    margin: 0 auto 12px;
    overflow: hidden;
  }
  .loader-bar {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 2px;
    animation: loading 1.5s ease-in-out infinite;
  }
  @keyframes loading {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }
  .status {
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
<div class="splash">
  <div class="icon">&#9835;</div>
  <h1>HIFI Detector</h1>
  <div class="subtitle">Audio Quality Analysis</div>
  <div class="loader">
    <div class="loader-bar"></div>
  </div>
  <div class="status">Starting engine...</div>
</div>
</body>
</html>
