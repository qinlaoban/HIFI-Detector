[package]
name = "hifi-detector"
version = "0.1.0"
edition = "2021"
description = "HIFI Audio Quality Detector - Desktop App"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
