[project]
name = "hifi-detector"
version = "0.1.0"
description = "HIFI audio quality detection tool — verify authenticity and quality of audio files"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "typer[all]>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
]

[project.scripts]
hifi-detect = "hifi_detector.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hifi_detector*"]
