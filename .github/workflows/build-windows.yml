name: Build Windows

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: false
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows (${{ github.event.inputs.arch || 'x64' }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Python: build PyInstaller sidecar
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -e ".[web]"
          .venv\Scripts\pip install pyinstaller

      - name: Build Python sidecar (PyInstaller)
        shell: pwsh
        run: |
          .venv\Scripts\python -m PyInstaller `
            --distpath tauri\dist-python `
            --workpath tauri\build-python `
            --noconfirm `
            tauri\hifi-detect.spec

          if (-not (Test-Path tauri\src-tauri\python)) {
            New-Item -ItemType Directory -Path tauri\src-tauri\python -Force
          }
          Copy-Item -Force tauri\dist-python\hifi-detect-server\hifi-detect-server.exe tauri\src-tauri\python\
          Copy-Item -Recurse -Force tauri\dist-python\hifi-detect-server\_internal tauri\src-tauri\python\_internal

          Write-Host "Python sidecar ready:"
          Get-ChildItem tauri\src-tauri\python -Recurse | Measure-Object | Select-Object -ExpandProperty Count
          Write-Host "files copied"

      # ============================================================
      # Rust: compile Tauri binary
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tauri/src-tauri -> target'

      # ============================================================
      # Node: install Tauri CLI
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install npm dependencies
        run: |
          cd tauri
          npm install

      # ============================================================
      # Build: Tauri (MSI + NSIS)
      # ============================================================
      - name: Build Tauri Windows
        shell: pwsh
        run: |
          cd tauri
          $arch = "${{ github.event.inputs.arch || 'x64' }}"
          $env:TAURI_ENV_TARGET_TRIPLE = if ($arch -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          npx tauri build

      # ============================================================
      # Artifacts (always upload for download from Actions page)
      # ============================================================
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: msi-installer
          path: tauri/src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: tauri/src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: warn

      # ============================================================
      # Release: publish to GitHub Releases
      #   - push to main → rolling "latest" prerelease
      #   - push tag v*  → stable release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri/src-tauri/target/**/bundle/msi/*.msi
            tauri/src-tauri/target/**/bundle/nsis/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          body: |
            ## HIFI Detector — Windows Build

            ### Downloads
            - **MSI installer** — standard Windows installer
            - **NSIS installer** — alternative `.exe` installer

            ### What's new
            ${{ startsWith(github.ref, 'refs/tags/v') && 'Official release' || 'Latest build from main branch (pre-release)' }}
